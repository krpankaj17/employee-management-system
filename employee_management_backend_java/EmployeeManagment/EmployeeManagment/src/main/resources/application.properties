spring.application.name=EmployeeManagment
server.port=8080

# ===================================================================
# PostgreSQL Database Connection
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_management
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===================================================================
# Spring Data JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Flyway Database Migrations
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true


# ===================================================================
# Security & JWT Configuration
# ===================================================================
app.jwt.secret=e83b4cf7d9021a8c3214589d9e07890123456789abcdef0123456789abcdef01
# 60 minutes in milliseconds
app.jwt.access-expiration-ms=3600000
# 7 days in milliseconds
app.jwt.refresh-expiration-ms=604800000

# ===================================================================
# Swagger / OpenAPI
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=none
springdoc.swagger-ui.operations-sorter=none
springdoc.swagger-ui.display-request-duration=true


# ===================================================================
# Jackson JSON Serialization (snake_case matching Python schemas)
# ===================================================================
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

